name: test
on:
  workflow_dispatch:
    inputs:
      etiket:
        required: true
permissions:
  contents: read
jobs:
  coz:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RENDER_ANAHTAR: ${{ secrets.RENDER_ANAHTAR }}
        run: |
          gh release download "${{ inputs.etiket }}" -R "${{ github.repository }}" -p t.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:RENDER_ANAHTAR -in t.enc
